<p> Donors </p>

<button (click)="addDonor()"> Add Donor </button>

<table>
  <thead>
    <tr>
      <th>firstName</th>
      <th>lastName</th>
      <th>phone</th>
      <th>email</th>
      <th>address</th>
    </tr>
  </thead>

  <tbody>
    @for(d of donors$ | async; track d.id){
      <tr>
        <td>{{d.firstName}}</td>
        <td>{{d.lastName}}</td>
        <td>{{d.phoneNumber}}</td>
        <td>{{d.email}}</td>
        <td>{{d.address}}</td>

        <button (click)="delete(d.id)"> Delete Donor </button>
        <button (click)="updateDonor(d.firstName, d.lastName)">Update Donor</button>
    }
  </tbody>
</table>
