<p> Donors </p>
<table>
    <thead>
        <tr>
          <th> firstName </th>
          <th> lastName </th>
          <th> phone </th>
          <th> email </th>
          <th> address </th>
        </tr>
    </thead>

    <tbody>
        @for(d of donors$ | async; track d.id){
            <tr>
              <td> {{d.firstName}} </td>
              <td> {{d.lastName}} </td>
              <td> {{d.phone}} </td>
              <td> {{d.email}} </td>
              <td> {{d.address}} </td>
            </tr>
        }
    </tbody>
</table>
