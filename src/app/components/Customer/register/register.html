<h2>Register</h2> <form (ngSubmit)="register()"> <label for="username">Username</label> <input id="username" name="username" type="text" [(ngModel)]="user.username" required />
<label for="phone">Phone</label>
<input id="phone" name="phone" type="tel" [(ngModel)]="user.phone" />

<label for="email">Email</label>
<input id="email" name="email" type="email" [(ngModel)]="user.email" required />

<label for="password">Password</label>
<input id="password" name="password" type="password" [(ngModel)]="user.password" required />

<button type="submit" [disabled]="loading">Register</button>
<a routerLink="/login" style="margin-left:8px;">Already have an account? Login</a>

</form>
