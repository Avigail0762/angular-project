<p>lottery works!</p>
@for (g of gifts$ | async; track g.id) {
  <p>{{ g.name }}</p>
  <button (click)="draw(g.id)"  [disabled]="g.isDrawn">
    בצע הגרלה
  </button>
}
<button (click)="downloadWinnersReport()">📄 קבלת דוח זוכים</button>
<button (click)="getTotalIncome()">💰 הצג הכנסות</button>

<p *ngIf="totalIncome !== null">
  סה"כ הכנסות: {{ totalIncome }} ₪
</p>
